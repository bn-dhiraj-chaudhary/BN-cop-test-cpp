
name: COP Pipeline (cpp)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build TypeScript
        run: npm run build

      - name: Run Black Duck Polaris analysis
        env:
          POLARIS_SERVER_URL: ${{ vars.POLARIS_SERVER_URL }}
          POLARIS_ACCESS_TOKEN: ${{ secrets.POLARIS_ACCESS_TOKEN }}
          PROJECT: richrodz-s/webgoat
          BLDCMD: mvn -B clean install -DskipTests
        run: |
          echo "Configure your Polaris CLI/scan command here using POLARIS_SERVER_URL and POLARIS_ACCESS_TOKEN."

      - name: Polaris Black Duck Security Scan
        uses: blackduck-inc/black-duck-security-scan@v2
        with:
          polaris_server_url: ${{ vars.POLARIS_SERVER_URL }}
          polaris_access_token: ${{ secrets.POLARIS_ACCESS_TOKEN }}
          polaris_assessment_types: "SAST,SCA"
          polaris_application_name: "BN-cop-test-cpp-app"
          polaris_project_name: "bn-dhiraj-chaudhary/BN-cop-test-cpp"