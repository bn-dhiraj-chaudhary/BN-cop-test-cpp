version: "1"
serverUrl: https://csprod.polaris.black

project:
  name: demo-java
  branch: ${scm.git.branch}
  revision:
    name: ${scm.git.commit}
    date: ${scm.git.commit.date}

capture:
  build:
    cleanCommands:
      - shell: [mvn, -B, -f, pom.xml, clean]
    buildCommands:
      - shell: [mvn, -B, -f, pom.xml, install]

analyze:
  mode: central
  coverity:
    cov-analyze:
      - "--aggressiveness-level"
      - "high"
      - "--all"
      - "--brakeman-aggressiveness-level"
      - "high"
      - "--concurrency"
      - "--enable-audit-mode"
      - "--enable-constraint-fpp"
      - "--enable"
      - "HARDCODED_CREDENTIALS"
      - "--enable"
      - "ORM_LOST_UPDATE"
      - "--security"
      - "--webapp-security-aggressiveness-level"
      - "high"
      - "--webapp-security"

install:
  coverity:
    version: "2024.6.0"
